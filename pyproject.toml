[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwork-hotspot-mcp"
version = "0.1.0"
description = "STEPWORK 的上游热点发现 MCP Server（独立安装、零依赖）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
# browser 只服务 douhot（热点宝）一个源：它无公开 API，只能走 CDP 复用用户
# 已登录的浏览器。放进主 dependencies 会毁掉本 Server「零运行时依赖」的
# 立身之本，故单列；未装时该源显式报错，其余 11 源照常可用。
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
stepwork-hotspot-mcp = "stepwork_hotspot_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 免安装即可跑测试（src layout）
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "BLE"]
# JSON-RPC 载荷天然是 Any，逐处 noqa 只会淹没真正的类型问题
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
